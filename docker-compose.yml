services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: 4000
      ENABLE_ORDERS: 'true'
    ports: ['4000:4000']
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5

  products:
    build:
      context: .
      dockerfile: apps/products-mfe/Dockerfile
      args: { VITE_API_URL: http://localhost:4000/api }
    ports: ['4171:80']
    depends_on: { api: { condition: service_healthy } }
    healthcheck:
      {
        test: ['CMD-SHELL', 'wget -qO- http://localhost/health >/dev/null'],
        interval: 10s,
        timeout: 3s,
        retries: 5,
      }

  cart:
    build:
      context: .
      dockerfile: apps/cart-mfe/Dockerfile
      args: { VITE_API_URL: http://localhost:4000/api }
    ports: ['4172:80']
    depends_on: { api: { condition: service_healthy } }
    healthcheck:
      {
        test: ['CMD-SHELL', 'wget -qO- http://localhost/health >/dev/null'],
        interval: 10s,
        timeout: 3s,
        retries: 5,
      }

  orders:
    build:
      context: .
      dockerfile: apps/orders-mfe/Dockerfile
      args: { VITE_API_URL: http://localhost:4000/api }
    ports: ['4173:80']
    depends_on: { api: { condition: service_healthy } }
    healthcheck:
      {
        test: ['CMD-SHELL', 'wget -qO- http://localhost/health >/dev/null'],
        interval: 10s,
        timeout: 3s,
        retries: 5,
      }

  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
      args:
        VITE_API_URL: http://localhost:4000/api
        VITE_PRODUCTS_REMOTE_URL: http://localhost:4171/remoteEntry.js
        VITE_CART_REMOTE_URL: http://localhost:4172/remoteEntry.js
        VITE_ORDERS_REMOTE_URL: http://localhost:4173/remoteEntry.js
    ports: ['4170:80']
    depends_on:
      api: { condition: service_healthy }
      products: { condition: service_healthy }
      cart: { condition: service_healthy }
      orders: { condition: service_healthy }
